# 16-day city forecasts for the `mtnw` region (L-106, docs/REGIONS.md): Mountain West (WY, UT, CO). Open-Meteo, the same connector and terms
# as sources/weather.yaml (free, no key, personal use): wx.<city>.* per city (tmax, tmin, tmean, precip, wind, hdd, cdd,
# their normals, realized days) and the region composite wx.region.mtnw.* (population-weighted HDD / CDD for Gas and Power's
# demand estimates). ONE batched request per run for all 8 cities (`batch: true`), every 6 h (~0.17 req/h); normals one
# batched archive request per 30 d. Each city keeps its own named zone, so local days follow its own clock.
# HDD/CDD base 18 degC, as for every city here (the US convention is 65 degF = 18.3 degC).
id: weather_mtnw
name: Weather - Mountain West (WY, UT, CO) cities, 16 day forecast
region: rockies
type: python
module: montney.connectors.open_meteo
class: OpenMeteo
mode: cached
interval: 6h
retention:             # as sources/weather.yaml: run vintages are `forecast`; ended-day actuals `daily` (L-038/L-039)
  default: forecast
  "wx.*.realized": daily
params:
  batch: true
  forecast_days: 16
  past_days: 7
  hdd_base: 18
  normal_years: 10
  hdd_windows: [[1, 7], [8, 15]]
  tz: America/Denver
  locations:
    - {name: Denver, lat: 39.74, lon: -104.99}
    - {name: Colorado Springs, lat: 38.83, lon: -104.82}
    - {name: Salt Lake City, lat: 40.76, lon: -111.89}
    - {name: Ogden, lat: 41.22, lon: -111.97}
    - {name: Provo, lat: 40.23, lon: -111.66}
    - {name: Cheyenne, lat: 41.14, lon: -104.82}
    - {name: Casper, lat: 42.85, lon: -106.33}
    - {name: Grand Junction, lat: 39.06, lon: -108.55}
  composites:
    # Weights = 2020 US Census MSA population. Only the ratios matter.
    - id: region.mtnw
      name: Mountain West (WY, UT, CO) (8-city pop. wtd)
      weights: {denver: 2963821, colorado_springs: 755105, salt_lake_city: 1257936, ogden: 694863, provo: 671185, cheyenne: 100512, casper: 79955, grand_junction: 155703}
