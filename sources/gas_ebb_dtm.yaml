# Guardian (Joliet IL -> Wisconsin) and Viking (Emerson, Canada -> Minnesota -> Wisconsin; Fargo / Grand Forks ND),
# DT Midstream's Trellis infopost -> ebb.<guardian|viking>.<umw|bakken>.<category> (MMcf/d = Dth / 1,037) + named
# borders. Gas day = ts, as_of = Trellis's post time, all SCHEDULED. Research: docs/research/pipelines/east_and_rockies.md
# §7; method, requests and traps: montney/connectors/gas_ebb_dtm.py.
# Requests: 2 session pages + 2 report lists per run + 1 XML per pipe per new cycle (~8/day) + 2/day (yesterday's
# Intraday 3): ~58/day on dtmidstream.trellisenergy.com.
# No location file: the hand map below is every posted point (2026-11-13). States from the pipes' routes and the
# counterparties' own postings (NNG's location file names Viking at Pierz = Genola, Chisago, Polk; Guardian at Bluff
# Creek); points marked "inferred" are small and their state is a best reading of the route.
id: gas_ebb_dtm
name: Guardian and Viking (Illinois / Canada into Minnesota, Wisconsin)
type: python
module: montney.connectors.gas_ebb_dtm
class: EbbDtm
mode: cached
interval: 2h
region: rest          # multi-region (umw, bakken: Viking's North Dakota deliveries)
retention: daily
params:
  boards:
    - pipe: guardian
      label: Guardian
      code: GPL
      tsp: 11
      regions: [umw]
      overrides:
        # Illinois (outside every region): Joliet interconnects and the DeKalb landfill
        "352446": {state: IL, type: INT, note: Joliet Alliance}
        "338687": {state: IL, type: INT, note: Joliet ANR}
        "359485": {state: IL, type: INT, note: Joliet Midwestern}
        "359487": {state: IL, type: INT, note: Joliet Northern Border}
        "359508": {state: IL, type: INT, note: Joliet Peoples}
        "394756": {state: IL, type: INT, note: Joliet Vector}
        "880066": {state: IL, type: RNG, note: WM DeKalb landfill receipt}
        "880069": {state: IL, type: END, note: WM DeKalb delivery}
        # Wisconsin
        "359491": {state: WI, type: INT, note: "Bluff Creek NNG (Northern Natural at Walworth)"}
        "359490": {state: WI, type: LDC, note: "Bluff Creek WG (We Energies)"}
        "359493": {state: WI, type: LDC, note: Walworth}
        "359488": {state: WI, type: LDC, note: "Rockvale (downstream of Bluff Creek CS: the CS flow equals the WI net with it)"}
        "379832": {state: WI, type: LDC, note: Ixonia}
        "778102": {state: WI, type: LDC, note: Fox Valley}
        "778106": {state: WI, type: LDC, note: Chilton}
        "778110": {state: WI, type: LDC, note: Denmark}
        "778098": {state: WI, type: LDC, note: Rubicon}
        "778122": {state: WI, type: LDC, note: Sheboygan}
        "778114": {state: WI, type: LDC, note: SW Green Bay}
        "778118": {state: WI, type: LDC, note: West Green Bay}
        "880022": {state: WI, type: LDC, note: Kaukauna}
        "880042": {state: WI, type: LDC, note: "Kaukauna #2"}
        "880033": {state: WI, type: LDC, note: Eden}
        "880039": {state: WI, type: LDC, note: Mayville}
        "880054": {state: WI, type: RNG, note: BC Organics receipt (dairy RNG)}
        "880060": {state: WI, type: END, note: BC Organics delivery}
        "880045": {state: WI, type: RNG, note: Glacier Ridge landfill}
        "880048": {state: WI, type: RNG, note: Holsum Dairy}
        "880051": {state: WI, type: RNG, note: Mallard Ridge landfill}
        # pooling points (MLQ): virtual
        "473454": {drop: true, note: Wisconsin Electric Pool}
        "359505": {drop: true, note: Wisconsin Gas Pool}
        "799139": {drop: true, note: WPS Pool}
      named:
        ebb.guardian.border.il_wi:
          label: "Illinois -> Wisconsin (Bluff Creek CS, Walworth County WI)"
          plus: ["BLUFF CRK:S:R"]
    - pipe: viking
      label: Viking
      code: VGT
