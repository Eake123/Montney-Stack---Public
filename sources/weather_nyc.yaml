# 16-day city forecasts for the `nyc` region (L-106, docs/REGIONS.md): New York State (NYISO). Open-Meteo, the same connector and terms
# as sources/weather.yaml (free, no key, personal use): wx.<city>.* per city (tmax, tmin, tmean, precip, wind, hdd, cdd,
# their normals, realized days) and the region composite wx.region.nyc.* (population-weighted HDD / CDD for Gas and Power's
# demand estimates). ONE batched request per run for all 5 cities (`batch: true`), every 6 h (~0.17 req/h); normals one
# batched archive request per 30 d. Each city keeps its own named zone, so local days follow its own clock.
# HDD/CDD base 18 degC, as for every city here (the US convention is 65 degF = 18.3 degC).
id: weather_nyc
name: Weather - New York State (NYISO) cities, 16 day forecast
region: nyc
type: python
module: montney.connectors.open_meteo
class: OpenMeteo
mode: cached
interval: 6h
retention:             # as sources/weather.yaml: run vintages are `forecast`; ended-day actuals `daily` (L-038/L-039)
  default: forecast
  "wx.*.realized": daily
params:
  batch: true
  forecast_days: 16
  past_days: 7
  hdd_base: 18
  normal_years: 10
  hdd_windows: [[1, 7], [8, 15]]
  tz: America/New_York
  locations:
    - {name: New York, lat: 40.73, lon: -73.90}   # Queens: inside the region outline (L-106 rule 1)
    - {name: Buffalo, lat: 42.89, lon: -78.88}
    - {name: Rochester, lat: 43.16, lon: -77.61}
    - {name: Albany, lat: 42.65, lon: -73.76}
    - {name: Syracuse, lat: 43.05, lon: -76.15}
  composites:
    # Weights = 2020 US Census: MSA population; New York = the NY-state part of the NY metro (10 counties: the 5 boroughs, Nassau, Suffolk, Westchester, Rockland, Putnam). Only the ratios matter.
    - id: region.nyc
      name: New York State (NYISO) (5-city pop. wtd)
      weights: {new_york: 13166338, buffalo: 1166902, rochester: 1090135, albany: 899262, syracuse: 662057}
