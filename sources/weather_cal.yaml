# 16-day city forecasts for California (L-090) via Open-Meteo, the same connector and terms as sources/weather.yaml
# (free, no key, personal use). Series wx.<city>.* (tmax, tmin, tmean, precip, wind, hdd, cdd, normals, HDD windows,
# realized), plus the composite wx.cal.* (population-weighted). Named zone America/Los_Angeles (DST observed), so
# local days follow California's own clock; the connector's fixed-offset check is skipped for DST zones.
# Lean (Erik: requests limited): every 6 h, ONE batched request a run for all 7 cities (~0.17 req/h, L-106); normals one
# batched archive request per 30 d. + the region composite wx.region.cal.* (L-106).
# HDD/CDD base 18 degC, as for every other city (US convention is 65 degF = 18.3 degC).
id: weather_cal
name: Weather - California cities, 16 day forecast
region: cal            # budget/attribution region (sources/BUDGET.yaml); the runner reads it once Database wires it
type: python
module: montney.connectors.open_meteo
class: OpenMeteo
mode: cached
interval: 6h
retention:             # as sources/weather.yaml: run vintages are `forecast`; ended-day actuals `daily` (L-038/L-039)
  default: forecast
  "wx.*.realized": daily
params:
  batch: true          # L-106: one request per run for every location (was one per location)
  forecast_days: 16
  past_days: 7
  hdd_base: 18
  normal_years: 10
  hdd_windows: [[1, 7], [8, 15]]
  tz: America/Los_Angeles
  locations:
    - {name: Sacramento,    lat: 38.58, lon: -121.49}
    - {name: San Francisco, lat: 37.77, lon: -122.42}
    - {name: Fresno,        lat: 36.74, lon: -119.79}
    - {name: Los Angeles,   lat: 34.05, lon: -118.24}
    - {name: San Diego,     lat: 32.72, lon: -117.16}
    - {name: Riverside,     lat: 33.98, lon: -117.38}      # L-106: the Inland Empire (Riverside-San Bernardino)
    - {name: Bakersfield,   lat: 35.37, lon: -119.02}
  composites:
    # Weights = 2020 US Census population of each city's metropolitan statistical area. Only the ratios matter.
    - id: cal
      name: California (5-city pop. wtd)
      weights: {los_angeles: 13200998, san_francisco: 4749008, san_diego: 3298634, sacramento: 2397382,
                fresno: 1008654}
    # L-106 region composite (wx.region.cal.*): all 7 cities, 2020 US Census MSA population. wx.cal above is unchanged.
    - id: region.cal
      name: California (7-city pop. wtd)
      weights: {los_angeles: 13200998, san_francisco: 4749008, san_diego: 3298634, sacramento: 2397382,
                fresno: 1008654, riverside: 4599839, bakersfield: 909235}
