# Daily gas demand for the US regions, estimated: power burn (EIA-930 gas generation × fitted heat rate) + residential /
# commercial (fitted on the Weather agent's population-weighted HDD) + industrial (EIA monthly, same month last year).
# ZERO requests: reads power_eia930_gen, weather_<r> and gas_eia_states back from the store. Method, back-tests and how
# to refit: docs/research/pipelines/daily_demand_methods.md. Code: montney/connectors/gas_region_demand.py
id: gas_region_demand
name: Regions gas demand, est. (power burn + weather + industrial; US regions + SK, MB, QC, ON)
type: python
module: montney.connectors.gas_region_demand
class: GasRegionDemand
mode: cached
interval: 1h
region: rest          # multi-region, reads the store (0 requests)
# Retention tier (docs/db/RETENTION.md spec contract), pinned by gas; tests/test_gas_retention.py.
# Daily estimates stamped as_of = the day (today re-stamped each run until it ends, like gas_midwest_weather).
retention: daily
params:
  days: 10            # local days written each run (EIA-930 generation lands 11-38 h late)
  fitted:
    power: "HR on 2025-09..2026-08 (latest 12 published EIA months); tx affine on 2023-01..2026-08"
    rescom: "2021-01..2026-08, EIA residential + commercial vs Open-Meteo archive (ERA5) at the region's cities"
    industrial: "EIA monthly industrial (N3035) per state, newest published year per calendar month, as of 2026-11-13"
    refit: "yearly, or when a region's monthly miss leaves its band: see the research note (scripts + keyless data)"
  # rt: per BA, the ISO real-time gas series (summed) that stand in for EIA-930's late hours, × a ratio refitted every
  # run on the stored overlap (refused when unstable); a small BA (< 10 % of its group) short of a day takes its 7-day
  # mean. Complete local days only. See "Current days" in montney/connectors/gas_region_demand.py.
  # Per region: tz = the region file's; power = groups of EIA-930 BAs (lower case) with a heat rate (MMBtu/MWh) and an
  # optional base (MMcf/d); rescom = a + b x HDD at base_c (°C); band = monthly p90 miss of the 2024-01..2026-08
  # back-test. The cities and weights come from the weather source's `region.<r>` composite.
  regions:
    tx:
      name: Texas
      tz: America/Chicago
      states: [TX]
      power: [{bas: [erco, epe], hr: 9.113, base: 747.1, rt: {erco: [ercot.gen.gas]}}]   # EPE (2.5 %) holds
      rescom: {base_c: 18, a: 601.9, b: 236.5}
      weather: {source: weather_tx, composite: region.tx}
      band: 0.057
      note: "ERCOT + El Paso Electric; the fitted base and heat rate carry SPP's Panhandle and MISO's SE Texas plants."
    mtnw:
      name: Mountain West
      tz: America/Denver
      states: [WY, UT, CO]
      power: [{bas: [pace, psco, swpw], hr: 11.666, rt: {swpw: [sppw.gen.gas]}}]   # PACE + PSCO (82 %) have no RT feed
      rescom: {base_c: 16, a: 269.2, b: 86.8}
      weather: {source: weather_mtnw, composite: region.mtnw}
      band: 0.167
      note: "2026 drift: EIA's UT/CO/WY power burn rose 30-80 % on flat EIA-930 output (LDWP's Intermountain units in
        Utah sit in LDWP; WY unexplained); heat rate refitted on the latest 12 months."
    sunbelt:
      name: Upper Sunbelt
      tz: America/Phoenix
      states: [NV, AZ, NM]
      power: [{bas: [azps, srp, tepc, walc, nevp, pnm, deaa], hr: 10.205}]
      rescom: {base_c: 20, a: 288.3, b: 85.5}
      weather: {source: weather_sunbelt, composite: region.sunbelt}
      band: 0.082
      note: "EIA withholds Nevada and New Mexico industrial; those take the newest published year."
    nyc:
      name: New York
      tz: America/New_York
      states: [NY]
      power: [{bas: [nyis], hr: 7.704, rt: {nyis: [nyiso.gen.gas, nyiso.gen.dual_fuel]}}]   # EIA NG = gas + dual fuel
      rescom: {base_c: 15, a: 826.7, b: 208.0}
      weather: {source: weather_nyc, composite: region.nyc}
      band: 0.082
      note: "On the coldest days EIA-930 gas seems to include dual-fuel oil burn: the power term reads high."
    upne:
      name: Upper NE (New England)
      tz: America/New_York
      states: [ME, NH, VT, MA, RI, CT]
      power: [{bas: [isne], hr: 7.26, rt: {isne: [isone.gen.gas]}}]   # landfill gas is not in EIA NG
      rescom: {base_c: 15, a: 394.3, b: 111.9}
      weather: {source: weather_upne, composite: region.upne}
      band: 0.032
      note: "On the coldest days EIA-930 gas seems to include dual-fuel oil burn: the power term reads high."
    umw:
      name: Upper Midwest
      tz: America/Chicago
      states: [MN, WI, MI]
      power: [{bas: [miso], hr: 2.838}]
      rescom: {base_c: 16, a: 704.7, b: 232.1}
      weather: {source: weather_umw, composite: region.umw}
      band: 0.039
      note: "Power = a fitted share of all of MISO's gas generation (MISO straddles 15 states), not a umw measurement."
    bakken:
      name: Bakken
      tz: America/Denver
      states: [MT, ND]
      power: [{bas: [nwmt], hr: 12.268}, {bas: [miso, swpp], hr: 0.088}]
      rescom: {base_c: 14, a: 66.2, b: 17.0}
      weather: {source: weather_bakken, composite: region.bakken}
      band: 0.058
      note: "Montana from NorthWestern; North Dakota's power as a fitted share of MISO + SPP."
    pnw:
      name: PacNW
      tz: America/Los_Angeles
      role: cross_check
      states: [WA, OR, ID]
      power: [{bas: [bpat, pacw, pge, psei, ava, ipco, avrn, grid], hr: 8.671}]
      rescom: {base_c: 14, a: 267.5, b: 111.6}
      weather: {source: weather_pnw, composite: region.pnw}
      band: 0.058
      note: "WA + OR + ID only (no BC Lower Mainland); the region line is pnw.demand_est."
    cal:
      name: California
      tz: America/Los_Angeles
      role: cross_check
      states: [CA]
      power: [{bas: [ciso, banc, ldwp, iid, tidc], hr: 6.01}]
      rescom: {base_c: 18, a: 1168.4, b: 279.6}
      weather: {source: weather_cal, composite: region.cal}
      band: 0.117
      note: "LDWP's Intermountain units (Utah) are in LDWP; the region line is the measured cal.demand.total."
    # ---- Canadian provinces (orchestrator, L-107): the same recipe fitted to StatCan 25-10-0086 deliveries to
    # consumers (2019-01..2026-08). StatCan counts gas burned for power generation as industrial consumption, so a
    # province without a daily power series holds it inside industrial (last year's month). Ontario counts it daily
    # from IESO (heat rate fitted Apr-Oct 2023-2026 on StatCan industrial vs IESO gas MWh, R2 0.90) and takes last
    # year's month of it back out of industrial (industrial_less_power).
    sk:
      name: Saskatchewan
      tz: America/Regina
      province: SK
      rescom: {base_c: 15, a: 38.9, b: 10.89}
      weather: {source: weather, composite: region.wcan, cities: [regina, saskatoon]}
      band: 0.063
      note: "Industrial (potash, oil, upgraders, SaskPower's ~1.5 GW of gas plants) is ~80 % and held at last year's
        month; saskpower.gen.gas has no stored history to fit or split it yet."
    mb:
      name: Manitoba
      tz: America/Winnipeg
      province: MB
      rescom: {base_c: 16, a: 24.4, b: 7.49}
      weather: {source: weather, composite: region.mbnwo, cities: [winnipeg, brandon]}
      band: 0.181
      note: "Manitoba only (NW Ontario is in Ontario's StatCan total); no gas-fired power to speak of; StatCan's monthly
        industrial swings (p90 32 % year on year) set the band."
    qc:
      name: Québec
      tz: America/Toronto
      province: QC
      rescom: {base_c: 15, a: 73.4, b: 16.55}
      weather: {source: weather_qc, composite: region.qc}
      band: 0.084
      note: "Hydro-Québec's thermal output is ~0, so no power term."
    "on":            # quoted: a bare `on` is YAML true
      name: Ontario
      tz: America/Toronto
      province: "ON"   # quoted, as above
      industrial_less_power: true
      power:
        - series: ieso.gen.gas.daily
          label: IESO
          hr: 6.66
          # IESO gas MWh/d per calendar month, the newest complete year (kraken's ieso.gen.gas.daily, 2026-11-13);
          # used until the store holds last year's month
          power_ly: [[131630, 2026], [139441, 2026], [84041, 2026], [60310, 2026], [47494, 2026], [81234, 2026], [127367, 2026], [138036, 2026], [117492, 2026], [109355, 2026], [95877, 2025], [124302, 2025]]
      rescom: {base_c: 15, a: 446.9, b: 125.67}
      weather: {source: weather_ont, composite: region.sont}
      band: 0.102
      note: "All of Ontario (StatCan); weather from the south (sont cities). IESO days are EST dates."
  # Monthly industrial consumption per state (EIA) or province (StatCan, CA-<pv>), MMcf/d: [value, year] per calendar
  # month (Jan..Dec), the newest published year (NA / W / withheld cells skipped). Used until the store holds last
  # year's month.
  industrial:
    CA-SK: [[711.8, 2026], [702.9, 2026], [705.6, 2026], [662.6, 2026], [605.8, 2026], [614.9, 2026], [613.8, 2026], [658.5, 2026], [622.3, 2025], [611.1, 2025], [689.5, 2025], [722.8, 2025]]
