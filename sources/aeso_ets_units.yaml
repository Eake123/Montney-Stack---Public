# AESO ETS Current Supply & Demand: per-unit net generation (TNG) and max capability (MC).
# Keyless public report (plain HTTP). Gas-fired, wind and solar units plus the Grande Prairie-area non-gas units.
# Fuel for the CSV's headerless blocks comes from block order and is validated against the fuel
# table (sum of unit MC per fuel); a mismatch fails the fetch rather than mislabel units.
# Research: docs/research/power.md section 3.2. Terms: personal use, docs/research/DECISIONS.md.
id: aeso_ets_units
name: AESO ETS unit generation (gas-fired, wind, solar)
type: python
module: montney.connectors.aeso_ets
class: AesoEts
mode: cached
interval: 5m
# Retention tier (docs/db/RETENTION.md spec contract), pinned by power; tests/test_power_retention.py.
retention: fast
params:
  report: csd_units
  # wind/solar/hydro: per-asset MW for the map's farms and AB dams (network/power/{wind,solar,hydro_ab}.geojson).
  # They are never in gas burn (that uses the CSD fuel table, sources/aeso_csd.yaml).
  fuels: [simple_cycle, cogeneration, combined_cycle, gas_fired_steam, wind, solar, hydro]
  # Warn (fetch warning, non-gating) when AESO lists a wind/solar asset the map doesn't account for.
  watch_assets: {fuels: [wind, solar, hydro], network: [network/power/wind.geojson, network/power/solar.geojson,
                                                  network/power/hydro_ab.geojson]}
  extra_units: [GPEC, DAI1]   # Grande Prairie EcoPower, Daishowa: biomass/other, never in gas burn
# Plant-level sums for multi-unit plants and the oil-sands clusters (network/power/plants.geojson).
# A sum is only produced when every unit is in the report, so a renamed/retired unit shows up
# as a missing plant value rather than a silently smaller one.
derive:
  - id: aeso.plant.cascade.tng
    label: "Cascade Power Project net gen (CAS1+CAS2)"
    sum: [aeso.unit.cas1.tng, aeso.unit.cas2.tng]
    unit: MW
    freq: 5min
    group: AESO / Plants
  - id: aeso.plant.cascade.mc
    label: "Cascade Power Project max capability (CAS1+CAS2)"
    sum: [aeso.unit.cas1.mc, aeso.unit.cas2.mc]
    unit: MW
    freq: 5min
    group: AESO / Plants
