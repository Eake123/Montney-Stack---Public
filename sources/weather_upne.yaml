# 16-day city forecasts for the `upne` region (L-106, docs/REGIONS.md): Upper NE (New England). Open-Meteo, the same connector and terms
# as sources/weather.yaml (free, no key, personal use): wx.<city>.* per city (tmax, tmin, tmean, precip, wind, hdd, cdd,
# their normals, realized days) and the region composite wx.region.upne.* (population-weighted HDD / CDD for Gas and Power's
# demand estimates). ONE batched request per run for all 10 cities (`batch: true`), every 6 h (~0.17 req/h); normals one
# batched archive request per 30 d. Each city keeps its own named zone, so local days follow its own clock.
# HDD/CDD base 18 degC, as for every city here (the US convention is 65 degF = 18.3 degC).
id: weather_upne
name: Weather - Upper NE (New England) cities, 16 day forecast
region: upne
type: python
module: montney.connectors.open_meteo
class: OpenMeteo
mode: cached
interval: 6h
retention:             # as sources/weather.yaml: run vintages are `forecast`; ended-day actuals `daily` (L-038/L-039)
  default: forecast
  "wx.*.realized": daily
params:
  batch: true
  forecast_days: 16
  past_days: 7
  hdd_base: 18
  normal_years: 10
  hdd_windows: [[1, 7], [8, 15]]
  tz: America/New_York
  locations:
    - {name: Boston, lat: 42.36, lon: -71.06}
    - {name: Providence, lat: 41.82, lon: -71.41}
    - {name: Hartford, lat: 41.76, lon: -72.68}
    - {name: Bridgeport, lat: 41.18, lon: -73.19}
    - {name: New Haven, lat: 41.31, lon: -72.92}
    - {name: Worcester, lat: 42.26, lon: -71.80}
    - {name: Springfield MA, lat: 42.10, lon: -72.59}
    - {name: Portland ME, lat: 43.66, lon: -70.26}
    - {name: Manchester NH, lat: 42.99, lon: -71.46}
    - {name: Burlington VT, lat: 44.48, lon: -73.21}
  composites:
    # Weights = 2020 US Census MSA population. Only the ratios matter.
    - id: region.upne
      name: Upper NE (New England) (10-city pop. wtd)
      weights: {boston: 4941632, providence: 1676579, hartford: 1213531, bridgeport: 957419, new_haven: 864835, worcester: 978529, springfield_ma: 699162, portland_me: 551740, manchester_nh: 422937, burlington_vt: 225562}
