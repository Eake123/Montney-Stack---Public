                   # L-106 (Gas): + oil_statcan_provinces 1 per 3 days (StatCan WDS, ~5 KB; AB/SK/BC/MB crude).
                   # L-106 8c (Power, wcan): + power_bch_interties 1 req/h (~180 KB) + power_bch_load 1/day + power_saskpower
                   # 2/day (~8 KB): ~1.13 req/h.
                   # PLAN 9 (Power, wcan): + power_caiso_weim_load 4 req/h (oasis.caiso.com, one ~4 KB zip per 15 min run
                   # with every WEIM area's actual load; OASIS asks for <= 1 request per 5 s, no in-run retries).
                   # PLAN 9 (Power, wcan): power_saskpower 2/day -> 1/h (~8 KB) so saskpower.*_best follows the clock (+0.9).
                   # PLAN 9 (Power): + power_capacity_ca 1 request a week (StatCan WDS, one POST, ~50 KB; installed
                   # capacity by type for AB/BC/SK/MB/ON/QC): ~0.006 req/h.
  rest: 120        # caps day: no sources (everything has a region now); floor, so a stray source warns.
