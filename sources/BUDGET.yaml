# Upstream request budget per region (L-081, docs/ARCHITECTURE-REQUESTS.md §3).
# One cap per region in requests/hour, regions as in the `region` table (a source's region is source.region_id,
# the same mapping as the storage budget). `montney du` and `montney db check` compare it with the MEASURED rate
# (fetch_run.n_requests over the last 24 h) and warn when a region is over, naming its top sources.
# A warning, never a block. Adding a region: add its line here, then check `montney du` a day later.
# Sizing (L-081 caps day, 2026-11-04, schedule + refresh runs over 24 h): cap = 1.5 x the measured 24 h mean, rounded
# up, floor 3. The check judges the 24 h MEAN, so hourly spikes (a GFS run's probes, a restart's catch-ups: ab_nebc's
# busiest hour was 273 against a 138 mean) average out; 1.5x absorbs a day with a couple of restarts or a slow-feed
# retry storm, and a sustained rise past it (a new source, a cadence regression) warns. A region without a measured
# day keeps a provisional floor until it has one.
# L-107 (Erik, 2026-11-13): "the request limits I imposed before are too strict… increase them quite substantially.
# Don't be DDoSing people, but we can do much more than we're doing." Kraken is dedicated to this and the runner goes out
# through a VPN. Every region outside ab_nebc goes from 3-16 to 120 req/h, ab_nebc from 210 to 400, `rest` (sources that
# cover many regions at once) to 120. These are ceilings to watch, not targets: the rules that bind are per HOST
# (docs/REGIONS.md §6) and the client's pace (MONTNEY_HOST_GAP_S: at most 2 requests a second to one host).
# The per-source notes below are history: what each source cost when it was added.
requests_per_hour:
  ab_nebc: 400     # caps day: measured 137.6 req/h (weather_gfs 14.4, aeso_csd 12.0, aeso_ets_events 11.9 ...); Phase 0 ~285.
