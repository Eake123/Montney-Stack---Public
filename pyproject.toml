[project]
name = "montney-stack"
version = "0.1.0"
description = "Lightweight, moddable energy-market dashboard: pipelines, ISOs and weather, cached in DuckDB."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "duckdb>=1.0",
    "pyyaml>=6.0",
    "keyring>=25.0",
    # Always use the bundled IANA database, never the OS copy: Alberta moved to permanent UTC-6 on
    # 2026-11-01 (IANA tzdata 2026c), and stale OS zoneinfo would put every Alberta time 1 h off.
    "tzdata>=2026.5",
    "eccodes>=2.37",          # GRIB2 decoding for weather grids (Windows wheels bundle the DLLs)
    # Linux/macOS get the C library from eccodeslib. eccodes declares it only in its pure wheel's
    # metadata, which uv doesn't pick up, so list it explicitly.
    "eccodeslib; sys_platform != 'win32'",
    "psycopg[binary]>=3.2",   # Postgres + TimescaleDB driver (PLAN P3, L-033); binary wheels bundle libpq
    "psutil>=5.9",            # /api/system (L-097): process memory/CPU for the ☰ System tab, read-only
    "xlrd>=2.0.1",            # legacy .xls reader: NGTL Station % Utilization 2010-2016 (PLAN 5a history load)
    # Read-only MCP at /mcp/read (Krasnodar D29). Pinned exactly: a failing import or mount must never take the map down.
    "mcp==2.3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
montney = "montney.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["montney"]

[tool.pytest.ini_options]
testpaths = ["tests"]
